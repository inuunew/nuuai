<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#10302A">
<title>INUU MARKET - Top Up Game & Hosting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Layar sambutan -->
<div id="splash" class="splash">
  <div class="sp-box">
    <img id="spLogo" class="sp-logo" alt="">
    <h1>Welcome!</h1>
    <div class="sp-sub" id="spSub"></div>
    <div class="sp-desc" id="spDesc"></div>
    <button id="masuk" class="btn primary" type="button">Masuk ke toko</button>
  </div>
</div>

<!-- Bar atas -->
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#beranda">
      <img id="brandLogo" alt="">
      <div><div class="bn" id="brandName"></div><small id="brandTag"></small></div>
    </a>
    <button class="iconbtn cartbtn" type="button" id="cartBtn" aria-label="Keranjang"></button>
  </div>
</header>

<!-- Isi halaman (beranda, kategori, musik, kalkulator, info) -->
<main class="wrap" id="view"></main>

<footer class="foot" id="foot"></footer>

<!-- Bubble musik, muncul saat musik diputar di halaman lain -->
<div class="mini" id="mini" hidden></div>

<!-- Menu bawah -->
<nav class="tabbar" aria-label="Menu utama"><div class="tabs" id="tabs"></div></nav>

<!-- Detail produk, checkout, invoice -->
<div class="sheet" id="sheet" hidden>
  <div class="scrim"></div>
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-label="Detail pesanan"></div>
</div>

<!-- Perbesar QRIS -->
<div class="zoom" id="zoom" hidden><img id="zimg" alt="QRIS"></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
